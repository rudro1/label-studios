services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-securepassword}
      - POSTGRES_DB=${POSTGRES_DB:-labelstudio}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-labelstudio}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: always

  label_studio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Lower (e.g. 1536) if frontend `yarn run build` hits Docker OOM; raise on CI with more RAM.
        NODE_MEMORY_MB: ${NODE_MEMORY_MB:-2048}
    image: fixensy:latest
    ports:
      - "${APP_BIND_HOST:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      - LABEL_STUDIO_DATABASE_HOST=db
      - LABEL_STUDIO_DATABASE_PORT=5432
      - LABEL_STUDIO_DATABASE_USER=${POSTGRES_USER:-admin}
      - LABEL_STUDIO_DATABASE_PASSWORD=${POSTGRES_PASSWORD:-securepassword}
      - LABEL_STUDIO_DATABASE_NAME=${POSTGRES_DB:-labelstudio}
      - LABEL_STUDIO_DATABASE_ENGINE=django.db.backends.postgresql
      - DJANGO_DB=default
      - POSTGRE_HOST=db
      - POSTGRE_PORT=5432
      - POSTGRE_USER=${POSTGRES_USER:-admin}
      - POSTGRE_PASSWORD=${POSTGRES_PASSWORD:-securepassword}
      - POSTGRE_NAME=${POSTGRES_DB:-labelstudio}
      - LABEL_STUDIO_USERNAME=${LABEL_STUDIO_USERNAME}
      - LABEL_STUDIO_PASSWORD=${LABEL_STUDIO_PASSWORD}
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - HOST=${LABEL_STUDIO_HOST:-}
      - LABEL_STUDIO_BEHIND_PROXY=${LABEL_STUDIO_BEHIND_PROXY:-false}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-changeme-change-this-key}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - FIXENSY_SUPERADMIN_EMAIL=${FIXENSY_SUPERADMIN_EMAIL:-}
      - FIXENSY_SUPERADMIN_PASSWORD=${FIXENSY_SUPERADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ls_data:/label-studio/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s

volumes:
  postgres_data:
  ls_data:
