worker_processes auto;
daemon off;
pid /tmp/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000;
  server_tokens off;
  client_max_body_size 512M;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 2;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream django {
    server app:8000;
    keepalive 32;
  }

  server {
    listen 8085;
    server_tokens off;

    location /static/ {
      alias /label-studio/label_studio/core/static_build/;
      expires 7d;
      add_header Cache-Control "public";
    }

    location /react-app/ {
      alias /label-studio/web/dist/apps/labelstudio/;
      expires 7d;
      add_header Cache-Control "public";
    }

    location /label-studio-frontend/ {
      alias /label-studio/web/dist/libs/editor/;
      expires 7d;
    }

    location /dm/ {
      alias /label-studio/web/dist/libs/datamanager/;
      expires 7d;
    }

    location /nginx_health {
      return 200 "ok";
      add_header Content-Type text/plain;
    }

    location = /favicon.ico {
      alias /label-studio/label_studio/core/static_build/images/favicon.ico;
    }

    location / {
      proxy_pass http://django;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Cookie $http_cookie;
      proxy_pass_header Content-Type;
      proxy_pass_header Set-Cookie;
      proxy_connect_timeout 120s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_buffering on;
      proxy_buffer_size 16k;
      proxy_buffers 8 16k;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
      internal;
    }
  }
}
