services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - max_connections=250
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - statement_timeout=120000
      - -c
      - idle_in_transaction_session_timeout=60000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  app:
    image: ${IMAGE:-heartexlabs/label-studio:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Hosting
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST}
      LABEL_STUDIO_USERNAME: ${LABEL_STUDIO_USERNAME}
      LABEL_STUDIO_PASSWORD: ${LABEL_STUDIO_PASSWORD}
      ADMIN_EMAIL: ${LABEL_STUDIO_USERNAME}
      ADMIN_PASSWORD: ${LABEL_STUDIO_PASSWORD}
      PYTHONPATH: /label-studio/label_studio
      DJANGO_SETTINGS_MODULE: core.settings.label_studio
      # DB
      LABEL_STUDIO_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DJANGO_DB: postgresql
      POSTGRE_HOST: postgres
      POSTGRE_PORT: 5432
      POSTGRE_NAME: ${POSTGRES_DB}
      POSTGRE_USER: ${POSTGRES_USER}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD}
      # Redis (RQ)
      REDIS_LOCATION: redis://redis:6379/0
      # Logging
      JSON_LOG: ${JSON_LOG:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # uWSGI tuning. Workers ≈ CPU cores. Harakiri must exceed worst-case export time.
      UWSGI_PROCESSES: ${UWSGI_PROCESSES:-4}
      UWSGI_WORKER_HARAKIRI: ${UWSGI_WORKER_HARAKIRI:-600}
      UWSGI_WORKER_RELOAD_ON_RSS: ${UWSGI_WORKER_RELOAD_ON_RSS:-1024}
      # Cookie security (HTTPS required)
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-1}
      CSRF_COOKIE_HTTPONLY: ${CSRF_COOKIE_HTTPONLY:-1}
      # VPS storage policy: link-only imports (Cloudinary), no raw bytes on disk
      LINK_ONLY_IMPORT: ${LINK_ONLY_IMPORT:-1}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-label-studio}
      # Disable converter resource downloads on export (no Cloudinary re-fetch)
      CONVERTER_DOWNLOAD_RESOURCES: ${CONVERTER_DOWNLOAD_RESOURCES:-0}
      # RQ worker timeout (3h). Long export jobs.
      RQ_LONG_JOB_TIMEOUT: ${RQ_LONG_JOB_TIMEOUT:-10800}
      # Sentry off by default to avoid 429 spam. Set DSN explicitly to enable.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RATE: ${SENTRY_RATE:-0}
      FRONTEND_SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
      FRONTEND_SENTRY_RATE: ${FRONTEND_SENTRY_RATE:-0}
      COLLECT_ANALYTICS: ${COLLECT_ANALYTICS:-0}
      # CSP
      ENABLE_CSP: ${ENABLE_CSP:-1}
      LS_CSP_REPORT_ONLY: ${LS_CSP_REPORT_ONLY:-0}
    command: ["label-studio", "--port", "8000"]
    expose:
      - "8000"
    volumes:
      - labelstudio_data:/label-studio/data
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    deploy:
      resources:
        limits:
          memory: 4G

  rqworker:
    image: ${IMAGE:-heartexlabs/label-studio:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST}
      LABEL_STUDIO_DB: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DJANGO_DB: postgresql
      POSTGRE_HOST: postgres
      POSTGRE_PORT: 5432
      POSTGRE_NAME: ${POSTGRES_DB}
      POSTGRE_USER: ${POSTGRES_USER}
      POSTGRE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_LOCATION: redis://redis:6379/0
      JSON_LOG: ${JSON_LOG:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RQ_LONG_JOB_TIMEOUT: ${RQ_LONG_JOB_TIMEOUT:-10800}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET}
      CONVERTER_DOWNLOAD_RESOURCES: ${CONVERTER_DOWNLOAD_RESOURCES:-0}
      PYTHONPATH: /label-studio/label_studio
      DJANGO_SETTINGS_MODULE: core.settings.label_studio
    command: ["sh", "-c", "cd /label-studio && .venv/bin/python label_studio/manage.py rqworker default high low critical"]
    volumes:
      - labelstudio_data:/label-studio/data
    deploy:
      resources:
        limits:
          memory: 2G

  nginx:
    image: ${IMAGE:-heartexlabs/label-studio:latest}
    restart: unless-stopped
    depends_on:
      - app
    environment:
      APP_HOST: app
      LABEL_STUDIO_HOST: ${LABEL_STUDIO_HOST}
      NGINX_ERROR_LOG_LEVEL: warn
      # Generous body + timeout for export downloads of big snapshots
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-512M}
      NGINX_PROXY_READ_TIMEOUT: ${NGINX_PROXY_READ_TIMEOUT:-600s}
      NGINX_PROXY_SEND_TIMEOUT: ${NGINX_PROXY_SEND_TIMEOUT:-600s}
      NGINX_PROXY_CONNECT_TIMEOUT: ${NGINX_PROXY_CONNECT_TIMEOUT:-120s}
    command: ["nginx"]
    ports:
      - "80:8085"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535

volumes:
  postgres_data:
    external: true
    name: label-studios-develop_postgres_data
  redis_data:
    external: true
    name: label-studios-develop_redis_data
  labelstudio_data:
    external: true
    name: label-studios-develop_labelstudio_data
